<!doctype html>
<html lang="en">
  <head>
    <title>Sort Methods in Js</title>
    <meta name="viewport" content="width=device-width,intial-scale=1.0" />
    <meta charset="utf-8" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <script>
      //sort()-> arrange elements in ascending order and modifies the oroginal array
      const marks = [99, 60, 65, 75, 35, 10, 50, 45];
      console.log("before sorting marks is: " + marks.toString());
      console.log("after sorting marks is: " + marks.sort().toString());

      //reverse()-> descending order
      marks.reverse();
      console.log("after reverse marks1 is: " + marks.toString());

      //toSorted()-> same as sort but it wont modify the original array
      const marks1 = [99, 60, 65, 75, 35, 10, 50, 45];
      console.log("before toSorted marks1 is: " + marks1.toString());
      const marks2 = marks1.toSorted();
      console.log("after toSorted marks1 is: " + marks1.toString());
      console.log("after toSorted marks2 is: " + marks2.toString());

      //toReversed()-> same as reverse but it wont modify the original array
      console.log("before toReversed marks2 is: " + marks2.toString());
      const marks3 = marks2.toReversed();
      console.log("after toReversed marks2 is: " + marks2.toString());
      console.log("after toReversed marks3 is: " + marks3.toString());

      // comparision
      const ages = [14, 2, 12, 1, 22, 24, 15];
      const ages1 = ages.toSorted();
      console.log("compared sorting string is: " + ages1.toString());
      //sorting as a numbers
      const agescompare = ages1.toSorted(function (a, b) {
        return a - b;
      });
      console.log("number sorting with compare function:  " + agescompare.toString());
    </script>
  </head>
  <body>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
