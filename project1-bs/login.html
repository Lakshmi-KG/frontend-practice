<!doctype html>
<html lang="en">
  <head>
    <title>Login form</title>
    <link rel="stylesheet" href="css/styles.css" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
  </head>
  <body>
    Login form
    <form class="loginform flexcolumn container w-100">
      <h1 class="login-h1 pb-3 pt-2">Login Form</h1>
      <div class="subdiv-1">
        <label for="username">Username:<sup>*</sup></label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Enter Userame"
          required
        />
      </div>
      <div class="subdiv-2">
        <label for="pwd">Password:<sup>*</sup></label>
        <input
          type="password"
          id="pwd"
          name="pwd"
          placeholder="Enter Password"
          required
        />
      </div>
      <br />
      <button type="submit" value="Login">
        <a href="index.html">Login</a>
      </button>
      <div class="loginsubdiv-3 row">
        <div class="leftside-div col pt-4 fw-bold">
          Don't have an account <a href="registerform.html">sin up</a>
        </div>
        <div class="rightside-div col pt-4 fw-bold">
          <a href="#">Forgot Password ?</a>
        </div>
      </div>
    </form>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
